<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>{% block title %}CBT문제{% endblock %}</title>
<style>
  :root {
    --ink: #22252b;
    --ink-soft: #6b7280;
    --paper: #f5f6f8;
    --card: #ffffff;
    --accent: #3a5ba0;
    --accent-soft: #eaf0fb;
    --good: #1e8e5a;
    --good-bg: #e8f7ef;
    --bad: #c0392b;
    --bad-bg: #fdecea;
    --border: #e2e4e9;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    line-height: 1.5;
  }
  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 16px 40px;
  }
  h1 {
    font-size: 1.25rem;
    margin: 0 0 4px;
  }
  .sub {
    color: var(--ink-soft);
    font-size: 0.85rem;
    margin: 0 0 20px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 16px;
  }
  .exam-switch {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .exam-switch a {
    flex: 1;
    text-align: center;
    padding: 10px;
    border-radius: 10px;
    background: var(--paper);
    border: 1px solid var(--border);
    color: var(--ink-soft);
    font-size: 0.85rem;
    font-weight: 600;
    text-decoration: none;
  }
  .exam-switch a.active {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }
  label {
    display: block;
    font-size: 0.8rem;
    color: var(--ink-soft);
    margin: 14px 0 6px;
  }
  label:first-child { margin-top: 0; }
  select, input[type="number"] {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 1rem;
    background: var(--paper);
    color: var(--ink);
  }
  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 16px;
    font-size: 0.9rem;
  }
  .checkbox-row input { width: 18px; height: 18px; }
  button, .btn {
    display: block;
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: var(--accent);
    color: white;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    margin-top: 18px;
  }
  button:active, .btn:active { opacity: 0.85; }
  .btn-secondary {
    background: var(--accent-soft);
    color: var(--accent);
  }
  .progress {
    font-family: ui-monospace, Consolas, monospace;
    font-size: 0.8rem;
    color: var(--ink-soft);
    margin-bottom: 8px;
  }
  .badge {
    display: inline-block;
    font-size: 0.72rem;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
    margin-right: 6px;
  }
  .q-label, .choices-label {
    display: block;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: var(--accent);
    margin: 14px 0 6px;
  }
  .q-label:first-child { margin-top: 0; }
  .stem {
    font-size: 1.05rem;
    font-weight: 600;
    line-height: 1.55;
    margin: 0 0 16px;
    padding: 12px 14px;
    background: var(--accent-soft);
    border-left: 4px solid var(--accent);
    border-radius: 4px 10px 10px 4px;
    white-space: pre-wrap;
  }
  .q-image {
    display: block;
    max-width: 100%;
    height: auto;
    border: 1px solid var(--border);
    border-radius: 10px;
    margin: 0 0 16px;
  }
  .choices {
    border-top: 1px dashed var(--border);
    padding-top: 4px;
  }
  .option {
    display: block;
    width: 100%;
    text-align: left;
    padding: 12px 14px;
    margin-bottom: 10px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--paper);
    color: var(--ink);
    font-size: 0.95rem;
    cursor: pointer;
  }
  .option .num { color: var(--accent); font-weight: 700; margin-right: 6px; }
  .option.correct { background: var(--good-bg); border-color: var(--good); }
  .option.wrong { background: var(--bad-bg); border-color: var(--bad); }
  .result-banner {
    font-weight: 700;
    padding: 10px 12px;
    border-radius: 10px;
    margin: 12px 0;
  }
  .result-banner.correct { background: var(--good-bg); color: var(--good); }
  .result-banner.wrong { background: var(--bad-bg); color: var(--bad); }
  .explanation {
    font-size: 0.9rem;
    color: var(--ink-soft);
    background: var(--paper);
    border-radius: 10px;
    padding: 12px;
    margin-top: 4px;
    white-space: pre-wrap;
  }
  .combo-row {
    font-size: 0.92rem;
    font-weight: 600;
    margin: 4px 0 14px;
  }
  .combo-d { color: var(--accent); }
  .combo-c { color: var(--bad); }
  .combo-arrow { color: var(--ink-soft); margin: 0 0.4em; font-weight: 400; }
  .void-badge {
    display: inline-block;
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--ink-soft);
    background: var(--paper);
    border: 1px dashed var(--border);
    border-radius: 999px;
    padding: 3px 10px;
  }
  .taccount {
    display: flex;
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 4px;
  }
  .tside {
    flex: 1;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 0;
  }
  .tside.td { border-right: 1px dashed var(--border); }
  .tlbl {
    font-size: 0.66rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    margin-bottom: 2px;
  }
  .tside.td .tlbl { color: var(--accent); }
  .tside.tc .tlbl { color: var(--bad); }
  .tln { font-size: 0.86rem; word-break: keep-all; overflow-wrap: break-word; }
  .tln .tacct { display: block; }
  .tln .tamt { display: block; color: var(--ink-soft); font-size: 0.8rem; font-variant-numeric: tabular-nums; }
  .no-entry-box {
    font-size: 0.85rem;
    color: var(--ink-soft);
    font-style: italic;
    background: var(--paper);
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 4px;
  }
  .score-big {
    font-size: 2.4rem;
    font-weight: 800;
    color: var(--accent);
    text-align: center;
    margin: 6px 0;
  }
  .wrong-item {
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.88rem;
  }
  .wrong-item:last-child { border-bottom: none; }
  .gloss { border-top: 1px dashed var(--border); padding-top: 10px; margin-top: 4px; }
  .gloss-row { padding: 8px 0; border-bottom: 1px solid var(--border); }
  .gloss-row:last-child { border-bottom: none; }
  .gloss-row b { font-size: 0.95rem; }
  .gloss-text { font-size: 0.85rem; color: var(--ink-soft); margin-top: 3px; line-height: 1.5; }
  .kind {
    font-size: 0.68rem; padding: 1px 7px; border-radius: 999px;
    margin-left: 6px; vertical-align: 1px; font-weight: 700;
  }
  .kind-자산, .kind-자산차감 { background: #e7f0ff; color: #2a55a8; }
  .kind-부채 { background: #fdeee2; color: #a8551d; }
  .kind-자본 { background: #f0e8fb; color: #6a3ea8; }
  .kind-수익 { background: var(--good-bg); color: var(--good); }
  .kind-비용 { background: var(--bad-bg); color: var(--bad); }
</style>
</head>
<body>
<div class="wrap">
  {% block content %}{% endblock %}
</div>
</body>
</html>
